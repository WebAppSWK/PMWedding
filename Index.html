<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meena & Por Wedding Invitation</title>
  
  <!-- นำเข้าฟอนต์ Prompt (สำหรับข้อความทั่วไป) และ Playfair Display (สำหรับหัวข้อ) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- นำเข้า Tailwind CSS ผ่าน CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ตั้งค่าสีและฟอนต์สำหรับ Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'wedding-champagne': '#E5D3B3',
            'wedding-sage': '#9CAF88',
            'wedding-blue': '#B4C6D4',
            'wedding-bg': '#FAFAFA'
          },
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- นำเข้า React และ ReactDOM ผ่าน CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- นำเข้า Babel สำหรับแปลง JSX ให้ทำงานบนเบราว์เซอร์ได้โดยตรง -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* CSS เพิ่มเติมสำหรับแอนิเมชัน Fade-in */
    .fade-in {
      animation: fadeIn 1.5s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-wedding-bg font-sans text-gray-800">

  <!-- จุดที่จะแสดงผล React -->
  <div id="root"></div>

  <!-- โค้ด React (JSX) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function WeddingCard() {
      const [isVisible, setIsVisible] = useState(false);
      const [rsvpStatus, setRsvpStatus] = useState('');
      const [guestCount, setGuestCount] = useState(1);
      const [guestName, setGuestName] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);

      useEffect(() => {
        setIsVisible(true);
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        // ส่วนนี้คือจุดสำหรับเขียน fetch ส่งข้อมูลไป Google Apps Script (ไฟล์ PM-V1.1)
        console.log({ name: guestName, status: rsvpStatus, count: rsvpStatus === 'attending' ? guestCount : 0 });
        setIsSubmitted(true);
      };

      return (
        <div className="min-h-screen flex justify-center bg-gray-100">
          {/* Container จำลองหน้าจอมือถือ */}
          <div className="w-full max-w-md bg-white shadow-xl overflow-hidden relative min-h-screen">
            
            {/* พื้นหลังตกแต่ง */}
            <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-wedding-champagne/30 to-transparent"></div>
            <div className="absolute bottom-0 right-0 w-64 h-64 bg-wedding-sage/10 rounded-full blur-3xl -mr-20 -mb-20"></div>

            <main className={`relative z-10 px-8 py-16 flex flex-col items-center text-center transition-opacity duration-1000 ${isVisible ? 'fade-in' : 'opacity-0'}`}>
              
              {/* ส่วนหัว */}
              <p className="text-xs tracking-[0.2em] text-gray-500 mb-4">YOU ARE INVITED TO CELEBRATE THE WEDDING OF</p>
              <h1 className="font-serif text-4xl text-wedding-sage mb-2">Meena & Por</h1>
              <p className="text-lg text-gray-600 mb-8">สิริญญา & ปิยะณัฐ</p>
              
              <div className="w-16 h-[1px] bg-wedding-champagne mb-8"></div>

              {/* วันที่และเวลา */}
              <div className="mb-10 space-y-2">
                <p className="text-xl font-medium tracking-wider">16 . 01 . 2027</p>
                <p className="text-gray-600">เวลา 09:00 - 11:00 น.</p>
              </div>

              {/* สถานที่ */}
              <div className="mb-10">
                <p className="font-medium mb-1">คริสตจักรโรงเรียนปรินส์รอยแยลส์วิทยาลัย</p>
                <p className="text-sm text-gray-500 mb-5">อ.เมือง จ.เชียงใหม่</p>
                <a 
                  href="https://maps.app.goo.gl/uP4q4m4hB8oWkX2r7" 
                  target="_blank" 
                  className="inline-block px-6 py-2 bg-wedding-sage text-white text-sm rounded-full shadow-sm hover:bg-opacity-90 transition-all"
                >
                  เปิดแผนที่ Google Maps
                </a>
              </div>

              <div className="w-full h-[1px] bg-gray-100 mb-10"></div>

              {/* กำหนดการ */}
              <div className="w-full mb-10 text-left">
                <h3 className="font-serif text-xl text-center mb-6 text-wedding-sage">กำหนดการ</h3>
                <ul className="space-y-4 text-sm">
                  <li className="flex justify-between border-b border-gray-50 pb-2">
                    <span className="font-medium text-gray-700">08:30 น.</span>
                    <span className="text-gray-600">ต้อนรับแขกผู้มีเกียรติ</span>
                  </li>
                  <li className="flex justify-between border-b border-gray-50 pb-2">
                    <span className="font-medium text-wedding-sage">09:00 น.</span>
                    <span className="text-gray-600">พิธีนมัสการพระเจ้าเพื่อมงคลสมรส</span>
                  </li>
                  <li className="flex justify-between pb-2">
                    <span className="font-medium text-gray-700">11:00 น.</span>
                    <span className="text-gray-600">ร่วมถ่ายภาพเป็นที่ระลึก</span>
                  </li>
                </ul>
              </div>

              {/* Dress Code */}
              <div className="w-full mb-12">
                <h3 className="font-serif text-xl mb-4 text-wedding-sage">Dress Code</h3>
                <p className="text-sm text-gray-500 mb-6">Minimal Elegance (เรียบหรู สบายตา)</p>
                <div className="flex justify-center gap-6">
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-10 h-10 rounded-full bg-wedding-champagne shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500">Champagne</span>
                  </div>
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-10 h-10 rounded-full bg-wedding-sage shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500">Sage Green</span>
                  </div>
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-10 h-10 rounded-full bg-wedding-blue shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500">Powder Blue</span>
                  </div>
                </div>
              </div>

              {/* แบบฟอร์ม RSVP */}
              <div className="w-full bg-gray-50 p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 className="font-serif text-xl mb-4 text-wedding-sage">RSVP</h3>
                
                {!isSubmitted ? (
                  <form onSubmit={handleSubmit} className="text-left space-y-5">
                    <div>
                      <label className="block text-sm text-gray-600 mb-1">ชื่อ - นามสกุล</label>
                      <input 
                        type="text" 
                        required 
                        value={guestName}
                        onChange={(e) => setGuestName(e.target.value)}
                        className="w-full px-4 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-wedding-sage focus:ring-1 focus:ring-wedding-sage" 
                        placeholder="ระบุชื่อของคุณ" 
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm text-gray-600 mb-2">การเข้าร่วมงาน</label>
                      <div className="space-y-2">
                        <label className="flex items-center gap-3 text-sm cursor-pointer p-2 border border-gray-100 rounded-lg bg-white">
                          <input type="radio" name="status" value="attending" onChange={(e) => setRsvpStatus(e.target.value)} required className="text-wedding-sage accent-wedding-sage" />
                          ยินดีมาร่วมงาน
                        </label>
                        <label className="flex items-center gap-3 text-sm cursor-pointer p-2 border border-gray-100 rounded-lg bg-white">
                          <input type="radio" name="status" value="declined" onChange={(e) => setRsvpStatus(e.target.value)} className="text-wedding-sage accent-wedding-sage" />
                          ไม่สามารถมาร่วมงานได้
                        </label>
                      </div>
                    </div>

                    {rsvpStatus === 'attending' && (
                      <div className="fade-in">
                        <label className="block text-sm text-gray-600 mb-1">จำนวนผู้เข้าร่วม (รวมตัวเอง)</label>
                        <select 
                          value={guestCount} 
                          onChange={(e) => setGuestCount(Number(e.target.value))} 
                          className="w-full px-4 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-wedding-sage focus:ring-1 focus:ring-wedding-sage bg-white"
                        >
                          <option value="1">1 ท่าน</option>
                          <option value="2">2 ท่าน</option>
                          <option value="3">3 ท่าน</option>
                          <option value="4">4 ท่าน</option>
                        </select>
                      </div>
                    )}

                    <button type="submit" className="w-full py-3 mt-2 bg-wedding-champagne text-gray-800 text-sm font-medium rounded-lg shadow-sm hover:bg-opacity-90 transition-all">
                      ยืนยันการตอบรับ
                    </button>
                  </form>
                ) : (
                  <div className="py-8 text-center fade-in">
                    <div className="w-12 h-12 bg-wedding-sage text-white rounded-full flex items-center justify-center mx-auto mb-4 text-xl">✓</div>
                    <p className="text-wedding-sage text-lg mb-1 font-medium">บันทึกข้อมูลเรียบร้อย</p>
                    <p className="text-sm text-gray-500">ขอบคุณสำหรับการตอบรับ<br/>แล้วพบกันในวันงานครับ/ค่ะ</p>
                    <p className="text-xs text-wedding-sage mt-4 font-serif">#PMWedding2027</p>
                  </div>
                )}
              </div>

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WeddingCard />);
  </script>
</body>
</html>
