```html
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piyanat & Sirinya Wedding</title>
  
  <!-- นำเข้าฟอนต์ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- นำเข้า Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ตั้งค่าสีและฟอนต์สำหรับ Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'floral-blue': '#A3BACE',
            'floral-green': '#5A7247',
            'arch-gold': '#A69055',
            'paper-bg': '#FDFBF7',
            'wedding-champagne': '#E5D3B3',
            'wedding-sage': '#9CAF88',
            'wedding-blue': '#B4C6D4',
            'text-dark': '#2A3026'
          },
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            script: ['Great Vibes', 'cursive']
          }
        }
      }
    }
  </script>

  <!-- นำเข้า React และ Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* CSS เพิ่มเติมสำหรับแอนิเมชัน Fade-in */
    .fade-in-up {
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* พื้นผิวสไตล์กระดาษวาดเขียน */
    .texture-bg {
      background-color: #FDFBF7;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="bg-gray-200 font-sans text-text-dark">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [isVisible, setIsVisible] = useState(false);
      const [rsvpStatus, setRsvpStatus] = useState('');
      const [guestCount, setGuestCount] = useState(1);
      const [guestName, setGuestName] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);

      useEffect(() => {
        // หน่วงเวลาเล็กน้อยให้หน้าเว็บโหลดเสร็จก่อนแสดงผล
        const timer = setTimeout(() => setIsVisible(true), 100);
        return () => clearTimeout(timer);
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        // ส่วนนี้คือจุดส่งข้อมูล (ในอนาคตสามารถต่อ API ได้)
        console.log({ 
          name: guestName, 
          status: rsvpStatus, 
          count: rsvpStatus === 'attending' ? guestCount : 0 
        });
        setIsSubmitted(true);
      };

      return (
        <div className="min-h-screen flex justify-center w-full">
          {/* Container จำลองหน้าจอมือถือ */}
          <div className="w-full max-w-md bg-paper-bg shadow-2xl overflow-hidden relative min-h-screen texture-bg">
            
            {/* กราฟิกสีน้ำจำลอง (ดอกไฮเดรนเยียสีฟ้าและใบไม้สีเขียว) */}
            <div className="absolute top-0 left-0 w-48 h-48 bg-floral-blue/20 rounded-full blur-3xl -ml-10 -mt-10 pointer-events-none"></div>
            <div className="absolute top-20 right-0 w-32 h-32 bg-floral-green/15 rounded-full blur-2xl -mr-10 pointer-events-none"></div>
            <div className="absolute bottom-0 right-0 w-64 h-64 bg-floral-blue/20 rounded-full blur-3xl -mr-20 -mb-20 pointer-events-none"></div>

            <main className={`relative z-10 px-6 py-12 flex flex-col items-center transition-opacity duration-1000 ${isVisible ? 'fade-in-up' : 'opacity-0'}`}>
              
              {/* Block 1: Cover */}
              <div className="w-full border-[1.5px] border-arch-gold rounded-t-full pt-16 pb-12 px-4 flex flex-col items-center text-center bg-white/40 backdrop-blur-sm relative mb-12 shadow-sm">
                <div className="absolute -top-4 -left-4 w-16 h-16 bg-floral-blue/30 rounded-full blur-xl"></div>
                <div className="absolute -top-4 -right-4 w-12 h-12 bg-floral-green/20 rounded-full blur-xl"></div>
                
                <p className="text-[10px] tracking-[0.3em] text-gray-500 mb-6 uppercase">The Wedding Of</p>
                
                <h1 className="font-script text-5xl md:text-6xl text-text-dark leading-tight mb-2">Piyanat</h1>
                <p className="font-script text-2xl md:text-3xl text-arch-gold my-1">and</p>
                <h1 className="font-script text-5xl md:text-6xl text-text-dark leading-tight mb-8">Sirinya</h1>
                
                <p className="font-serif text-sm tracking-[0.15em] text-text-dark mb-4 uppercase">16 January 2027</p>
                
                <div className="w-12 h-[1px] bg-arch-gold mb-4"></div>
                
                <p className="font-serif text-[10px] md:text-xs tracking-widest text-gray-600 uppercase max-w-[200px] leading-relaxed">
                  The Prince Royal's College Chapel, Chiang Mai
                </p>
              </div>

              {/* Block 2: บทคริสต์ธรรมคริสเตียน */}
              <div className="w-full text-center mb-16 px-4">
                <p className="font-serif text-lg md:text-xl text-arch-gold italic mb-4">"ความรักนั้นก็อดทนนานและกระทำคุณให้..."</p>
                <p className="text-sm text-gray-600 leading-relaxed">
                  ขอเรียนเชิญท่านเพื่อเป็นเกียรติและร่วมขอพร<br/>
                  เนื่องในพิธีนมัสการพระเจ้าเพื่อมงคลสมรส
                </p>
              </div>

              {/* Block 3: กำหนดการ */}
              <div className="w-full bg-white/60 p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100 mb-12 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-arch-gold to-transparent opacity-30"></div>
                <h3 className="font-serif text-xl text-center mb-8 text-arch-gold tracking-widest uppercase">Schedule</h3>
                
                <div className="space-y-6">
                  <div className="flex items-start gap-4">
                    <div className="w-16 font-serif text-lg text-arch-gold text-right shrink-0">08:30</div>
                    <div className="border-l border-arch-gold/30 pl-4 pb-2">
                      <p className="font-medium text-text-dark text-sm md:text-base">ต้อนรับแขกผู้มีเกียรติ</p>
                      <p className="text-xs text-gray-500 mt-1">ลงทะเบียนและรับของชำร่วย</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-4">
                    <div className="w-16 font-serif text-lg text-arch-gold text-right shrink-0">09:00</div>
                    <div className="border-l border-arch-gold/30 pl-4 pb-2">
                      <p className="font-medium text-text-dark text-sm md:text-base">พิธีมงคลสมรส</p>
                      <p className="text-xs text-gray-500 mt-1">พิธีนมัสการพระเจ้า</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-4">
                    <div className="w-16 font-serif text-lg text-arch-gold text-right shrink-0">11:00</div>
                    <div className="border-l border-arch-gold/30 pl-4">
                      <p className="font-medium text-text-dark text-sm md:text-base">ถ่ายภาพร่วมกัน</p>
                      <p className="text-xs text-gray-500 mt-1">เสร็จสิ้นพิธีการ</p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Block 4: สถานที่ */}
              <div className="w-full text-center mb-16">
                <h3 className="font-serif text-xl mb-4 text-arch-gold tracking-widest uppercase">Location</h3>
                <p className="font-medium mb-1 text-sm md:text-base">คริสตจักรโรงเรียนปรินส์รอยแยลส์วิทยาลัย</p>
                <p className="text-xs md:text-sm text-gray-500 mb-6">อ.เมือง จ.เชียงใหม่</p>
                <a 
                  href="https://maps.app.goo.gl/uP4q4m4hB8oWkX2r7" 
                  target="_blank" 
                  className="inline-block px-8 py-3 bg-[#4A5D4E] text-white text-xs md:text-sm tracking-wide rounded-full shadow-lg hover:bg-opacity-90 transition-all"
                >
                  นำทางด้วย Google Maps
                </a>
              </div>

              {/* Block 5: Dress Code */}
              <div className="w-full text-center mb-16 px-2">
                <h3 className="font-serif text-xl mb-2 text-arch-gold tracking-widest uppercase">Dress Code</h3>
                <p className="text-sm text-gray-500 mb-8">Minimal Elegance</p>
                <div className="flex justify-center gap-4 md:gap-6">
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-12 h-12 rounded-full bg-wedding-champagne shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500 font-serif">Champagne</span>
                  </div>
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-12 h-12 rounded-full bg-wedding-sage shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500 font-serif">Sage Green</span>
                  </div>
                  <div className="flex flex-col items-center gap-2">
                    <div className="w-12 h-12 rounded-full bg-wedding-blue shadow-md border-2 border-white"></div>
                    <span className="text-xs text-gray-500 font-serif">Powder Blue</span>
                  </div>
                </div>
              </div>

              {/* Block 6: RSVP */}
              <div className="w-full bg-white/70 p-6 rounded-2xl shadow-sm border border-arch-gold/20 backdrop-blur-sm">
                <h3 className="font-serif text-xl text-center mb-6 text-arch-gold tracking-widest uppercase">RSVP</h3>
                
                {!isSubmitted ? (
                  <form onSubmit={handleSubmit} className="text-left space-y-5">
                    <div>
                      <label className="block text-sm text-gray-600 mb-1">ชื่อ - นามสกุล</label>
                      <input 
                        type="text" 
                        required 
                        value={guestName}
                        onChange={(e) => setGuestName(e.target.value)}
                        className="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-arch-gold focus:ring-1 focus:ring-arch-gold bg-white/50" 
                        placeholder="ระบุชื่อของคุณ" 
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm text-gray-600 mb-2">การเข้าร่วมงาน</label>
                      <div className="space-y-2">
                        <label className="flex items-center gap-3 text-sm cursor-pointer p-3 border border-gray-100 rounded-lg bg-white/50 hover:bg-white transition-colors">
                          <input type="radio" name="status" value="attending" onChange={(e) => setRsvpStatus(e.target.value)} required className="text-arch-gold accent-arch-gold w-4 h-4" />
                          ยินดีมาร่วมงาน
                        </label>
                        <label className="flex items-center gap-3 text-sm cursor-pointer p-3 border border-gray-100 rounded-lg bg-white/50 hover:bg-white transition-colors">
                          <input type="radio" name="status" value="declined" onChange={(e) => setRsvpStatus(e.target.value)} className="text-arch-gold accent-arch-gold w-4 h-4" />
                          ไม่สามารถมาร่วมงานได้
                        </label>
                      </div>
                    </div>

                    {rsvpStatus === 'attending' && (
                      <div className="fade-in-up">
                        <label className="block text-sm text-gray-600 mb-1">จำนวนผู้เข้าร่วม (รวมตัวเอง)</label>
                        <select 
                          value={guestCount} 
                          onChange={(e) => setGuestCount(Number(e.target.value))} 
                          className="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-arch-gold focus:ring-1 focus:ring-arch-gold bg-white/50"
                        >
                          <option value="1">1 ท่าน</option>
                          <option value="2">2 ท่าน</option>
                          <option value="3">3 ท่าน</option>
                          <option value="4">4 ท่าน</option>
                        </select>
                      </div>
                    )}

                    <button type="submit" className="w-full py-3.5 mt-4 bg-arch-gold text-white text-sm tracking-widest uppercase font-medium rounded-lg shadow-md hover:bg-[#8e7a46] transition-all">
                      Confirm
                    </button>
                  </form>
                ) : (
                  <div className="py-8 text-center fade-in-up">
                    <div className="w-12 h-12 bg-arch-gold text-white rounded-full flex items-center justify-center mx-auto mb-4 text-xl">✓</div>
                    <p className="text-arch-gold text-lg mb-1 font-serif">Thank You</p>
                    <p className="text-sm text-gray-500">บันทึกข้อมูลเรียบร้อย<br/>แล้วพบกันในวันงานครับ/ค่ะ</p>
                  </div>
                )}
              </div>
              
              {/* Footer */}
              <div className="mt-16 pb-8 text-center w-full">
                <p className="font-script text-2xl text-arch-gold">#PMWedding2027</p>
              </div>

            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
